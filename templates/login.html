{% extends "base.html" %}
{% block title %}Login — GeoPermit{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-2"><i class="bi bi-geo-alt-fill"></i></div>
      <h4 class="fw-bold mb-0">GeoPermit System</h4>
      <p class="text-muted small mt-1">Sign in to your account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="mb-3">
        <label class="form-label fw-medium small">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium small">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>
      </div>
      <button type="submit" class="btn btn-gov w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-success fw-medium">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
